<!DOCTYPE html>
<html>

<head>
    <title>2473009 - Jeffry Leovandi Surjadi - Soal 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
        }

        ul#nav {
            list-style-type: none;
        }

        ul#nav li {
            float: left;
            position: relative;
            margin-right: 3px;
        }

        ul#nav li a {
            display: block;
            width: 125px;
            padding: 4px 0;
            text-decoration: none;
            color: #000;
            border: 2px dotted grey;
            text-align: center;
        }

        ul#nav li a:hover {
            background-color: black;
            color: white;
        }

        ul#nav li ul.submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            list-style-type: none;
            z-index: 999;
        }

        ul#nav li ul.submenu li {
            margin-top: 3px;
            float: none;
        }

        ul#nav li ul.submenu li a {
            background-color: #fff;
            width: 125px;
        }

        ul#nav li:hover ul.submenu {
            display: block;
        }

        #nav:after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>

<body>
    <ul id="nav">
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">News</a>
            <ul class="submenu">
                <li><a href="#">Sports</a></li>
                <li><a href="#">Music</a></li>
                <li><a href="#">Movie</a></li>
            </ul>
        </li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
    </ul>
</body>

</html>
