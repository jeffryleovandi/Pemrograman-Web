<!DOCTYPE html>
<html>
<body>
<table border="1">
    <tr>
        <th colspan="2" bgcolor="lightgray">Edit profile</th>
    </tr>
    <tr>
        <td>
            <img src="Tim Berners-Lee.png" width="100"><br>
            <input type="submit" value="Upload">
        </td>
        <td>
            <form>
                <table>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" value="Tim Berners-Lee"></td>
                    </tr>
                    <tr>
                        <td>Position</td>
                        <td>
                            <select>
                                <optgroup label="Programmer">
                                    <option selected>Senior Programmer</option>
                                    <option>Junior Programmer</option>
                                </optgroup>
                                <optgroup label="System Analyst">
                                    <option>Senior Analyst</option>
                                    <option>Junior Analyst</option>
                                </optgroup>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td>Confirm Password</td>
                        <td><input type="password"></td>
                    </tr>
                </table>
                <div align="right">
                    <input type="reset" value="Reset">
                    <input type="submit" value="Update">
                </div>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
