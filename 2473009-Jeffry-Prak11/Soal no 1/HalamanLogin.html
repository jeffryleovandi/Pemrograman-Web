<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .login-header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .login-body {
            padding: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .form-group label {
            width: 90px;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }

        .btn-login {
            display: block;
            margin-left: 90px;
            padding: 5px 15px;
            background: #ddd;
            border: 1px solid #aaa;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-login:hover {
            background: #c8c8c8;
        }

        .login-footer {
            padding: 10px 20px 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="login-header">Login</div>
        <div class="login-body">
            <form action="prosesLogin.php" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password">
                </div>
                <button type="submit" class="btn-login">login</button>
            </form>
        </div>
        <div class="login-footer">
            @UKM2014<br>
            Name-NRP&copy;
        </div>
    </div>
</body>

</html>
