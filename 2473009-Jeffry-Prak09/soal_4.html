<!DOCTYPE html>
<html>

<head>
    <title> 2473009 - Jeffry Leovandi Surjadi - Soal 4 </title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 5px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 50px;
            text-align: center;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        hr {
            margin: 4px 0;
        }
    </style>
</head>

<body>

    <table border="1" cellpadding="0" cellspacing="0">
        <tr>
            <td width="50" align="center">
                <input class="header" type="checkbox"/><br/>
                <hr/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/>
            </td>
        </tr>
    </table>

    <script>
        $(document).ready(function () {

            $("input.header").click(function () {
                var flag = $(this).prop("checked");

                if (flag) {
                    $("input:checkbox.body").prop("checked", true);
                } else {
                    $("input:checkbox.body").prop("checked", false);
                }
            });

            $("input.body").click(function () {
                var totalBody = $("input:checkbox.body").length;
                var totalChecked = $("input:checkbox.body:checked").length;

                if (totalChecked === totalBody) {
                    $("input.header").prop("checked", true);
                } else {
                    $("input.header").prop("checked", false);
                }
            });

        });
    </script>

</body>

</html>
